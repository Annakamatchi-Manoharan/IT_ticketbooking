version: "3.9"\nservices:\n  db:\n    image: postgres:16-alpine\n    environment:\n      POSTGRES_DB: it_ticket\n      POSTGRES_USER: postgres\n      POSTGRES_PASSWORD: postgres\n    ports: ["5432:5432"]\n    volumes:\n      - pgdata:/var/lib/postgresql/data\n      - ../apps/api/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql\n  redis:\n    image: redis:7-alpine\n    ports: ["6379:6379"]\n  api:\n    build: { context: ../apps/api }\n    env_file: [../apps/api/.env.example]\n    depends_on: [db, redis]\n    ports: ["8080:8080"]\n  web:\n    build: { context: ../apps/web }\n    environment: { NEXT_PUBLIC_API_URL: http://localhost:8080 }\n    depends_on: [api]\n    ports: ["3000:3000"]\nvolumes: { pgdata: {} }
